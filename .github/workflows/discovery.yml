name: Job discovery

# Runs 8 times a day on GitHub's servers (no laptop, no Claude), scrapes fresh
# postings, rebuilds the mobile page, and publishes it to GitHub Pages.
# GitHub cron is in UTC; IST = UTC + 5:30.
on:
  schedule:
    # Hourly at :23. GitHub silently drops many scheduled runs during its peak
    # (IST daytime = UTC peak), so we attempt every hour — more tries = more get
    # through. Concurrency (below) stops overlaps. For guaranteed timing, an
    # external cron pinging workflow_dispatch is the real fix.
    - cron: "23 * * * *"
  workflow_dispatch:         # lets you run it on demand from the Actions tab

permissions:
  contents: write            # to commit the "seen" state back so NEW works
  pages: write
  id-token: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install python-jobspy pandas
          npm install web-push --no-save --no-audit --no-fund

      - name: Scrape + build PM page
        run: python daily_run.py --profile pm --regions NL,DE,IE,IN --hours-old 336

      - name: Scrape + build Finance page
        run: python daily_run.py --profile finance --regions NL,DE,IE,IN --hours-old 336

      - name: Push new PM jobs
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node push.js push_pm.json

      - name: Push new Finance jobs
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION_FINANCE }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node push.js push_finance.json

      - name: Assemble site
        run: |
          mkdir -p _site
          cp digest.html _site/index.html
          cp finance.html _site/finance.html
          cp web/manifest.webmanifest web/manifest.finance.webmanifest web/sw.js web/icon-192.png web/icon-512.png web/apple-touch-icon.png _site/

      - name: Persist NEW-job state
        run: |
          git config user.name "job-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state || true
          git commit -m "state: $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
