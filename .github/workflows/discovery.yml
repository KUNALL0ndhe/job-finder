name: Job discovery

# Runs 8 times a day on GitHub's servers (no laptop, no Claude), scrapes fresh
# postings, rebuilds the mobile page, and publishes it to GitHub Pages.
# GitHub cron is in UTC; IST = UTC + 5:30.
on:
  schedule:
    - cron: "30 3 * * *"    # 09:00 Asia/Kolkata (03:30 UTC)
    - cron: "30 5 * * *"    # 11:00 Asia/Kolkata (05:30 UTC)
    - cron: "30 7 * * *"    # 13:00 Asia/Kolkata (07:30 UTC)
    - cron: "30 9 * * *"    # 15:00 Asia/Kolkata (09:30 UTC)
    - cron: "30 11 * * *"   # 17:00 Asia/Kolkata (11:30 UTC)
    - cron: "30 13 * * *"   # 19:00 Asia/Kolkata (13:30 UTC)
    - cron: "30 15 * * *"   # 21:00 Asia/Kolkata (15:30 UTC)
    - cron: "30 18 * * *"   # 00:00 Asia/Kolkata (18:30 UTC)
  workflow_dispatch:         # lets you run it on demand from the Actions tab

permissions:
  contents: write            # to commit the "seen" state back so NEW works
  pages: write
  id-token: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install python-jobspy pandas

      - name: Scrape + build page
        run: python daily_run.py --regions NL,DE,IE,IN --hours-old 336

      - name: Send push for new jobs
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          npm install web-push --no-save --no-audit --no-fund
          node push.js

      - name: Assemble site
        run: |
          mkdir -p _site
          cp digest.html _site/index.html
          cp web/manifest.webmanifest web/sw.js web/icon-192.png web/icon-512.png web/apple-touch-icon.png _site/

      - name: Persist NEW-job state
        run: |
          git config user.name "job-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state jobs.csv || true
          git commit -m "state: $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push skipped"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
